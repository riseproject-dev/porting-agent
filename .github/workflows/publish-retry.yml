# Publish-only retry (plan 5.2, 15.3): re-runs the trusted publish steps for
# one finished worker run whose publication failed on infrastructure
# (network, token, API). No agent, no model call. The same gates as the
# worker's publish job apply: that run's Claim must have a verified native
# Result in the queue (gh-aw v1.2.2 replay), the proposal artifact is
# downloaded by the Result's ID and digest, preflight re-checks state and
# fork identity, and the push uses the exact expected-head lease. If the push
# already happened, discovery confirms it instead of pushing again.
# A held `no_change` Result (a development worker's report of a failure not caused
# by the patch) is published by rerunning the failed jobs on the exact head
# with a token for the one fork that carries only `actions: write`; a rerun
# that already landed is read back instead of being requested again.
# A development patch was reviewed in its worker's run, so a retry publishes
# it like any other patch and posts the summary of that review on the pushed
# commit once, as the worker's publish job does.
#
# Launched by the controller's reconcile job (never by the agent), with the
# worker run ID it recorded in state.
name: Publish Retry

on:
  workflow_dispatch:
    inputs:
      worker-run-id:
        description: Worker run whose publication should be retried
        required: true
        type: string
      attempt:
        description: Publish attempt number (recorded in the outcome)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: porting-fork-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        env:
          RUN: ${{ inputs.worker-run-id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN" =~ ^[0-9]{1,20}$ ]] || { echo "bad worker-run-id"; exit 1; }
          [[ "$ATTEMPT" =~ ^[0-9]{1,3}$ ]] || { echo "bad attempt"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: control

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Re-resolve the original Claim's verified Result and artifact
        id: result
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.worker-run-id }}
        run: |
          set -euo pipefail
          mkdir -p ../in ../prev
          # The run must be a worker or planner run in this repository.
          path=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .path)
          WORKFLOW_PATH=${path%@*}
          case "$WORKFLOW_PATH" in
            .github/workflows/worker.lock.yml|.github/workflows/planner.lock.yml) ;;
            *) echo "run $RUN is not an porting worker or planner run"; exit 1 ;;
          esac
          # Its own publication record carries the original assignment.
          id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" \
            --jq '[.artifacts[] | select(.name == "porting-publication" and (.expired | not))] | if length == 1 then .[0].id else error("expected one publication artifact") end')
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > ../prev/p.zip
          unzip -q -j ../prev/p.zip assignment.json task.json -d ../in
          unzip -q -j -o ../prev/p.zip outcome.json -d ../prev 2>/dev/null || true
          rc=0
          gh_aw=$(scripts/install_gh_aw.sh "$RUNNER_TEMP/gh-aw-cli") || rc=3
          if [ "$rc" = 0 ]; then
            uv run --locked \
              python -m queue_result --gh-aw "$gh_aw" \
                --assignment ../in/assignment.json --run-id "$RUN" \
                --workflow "$WORKFLOW_PATH" --repo "$GITHUB_REPOSITORY" --out ../in || rc=$?
          else
            jq -n '{status:"infra_error", failure_class:"infrastructure", reason:"gh-aw install failed", stage:"result"}' > ../in/outcome.json
          fi
          if [ "$rc" != 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run --locked \
            python -m artifact extract ../in/proposal.zip ../in
          if [ "$(jq -r .task ../in/task.json)" = planning ]; then
            # Nothing to push: hand the plan to the controller.
            jq -n '{status:"planning", failure_class:null, reason:null, stage:"result"}' > ../in/outcome.json
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run --locked \
            python -m fork_publish preflight --record ../in/record.json --task ../in/task.json \
              --proposal ../in/proposal.json --report ../in/report.json \
              --out ../in/preflight.json
          jq -r '"fork_name=" + .fork_name, "publish=" + (.publish|tostring)' ../in/preflight.json >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .status ../in/preflight.json)" = no_change ]; then
            # The held Result reports a failure not caused by the patch: its
            # publication is the rerun of the failed jobs on the exact head.
            jq '{status:"no_change", failure_class:null, reason, stage:"preflight"}' \
              ../in/preflight.json > ../in/outcome.json
            uv run --locked \
              python -m ci_rerun preflight --record ../in/record.json --task ../in/task.json \
                --proposal ../in/proposal.json --out ../in/rerun.json
            jq -r '"rerun=" + (.rerun|tostring), "rerun_fork=" + .fork_name' ../in/rerun.json >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r .status ../in/preflight.json)" = unreviewed ]; then
            # A held Result that no review covers (a worker run of the earlier
            # pipeline, or a loop that records unavailable reviewers or a
            # review by the worker itself): it is relaunched, with nothing
            # charged.
            jq '{status:"unreviewed", failure_class:null, reason, stage:"preflight"}' \
              ../in/preflight.json > ../in/outcome.json
          elif [ "$(jq -r .publish ../in/preflight.json)" != true ]; then
            jq '{status:"rejected", failure_class:(.failure_class // "validation"), reason, stage:"preflight"}' \
              ../in/preflight.json > ../in/outcome.json
          fi

      - name: Mint a token for exactly this fork
        id: fork-token
        if: steps.result.outputs.publish == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RISEPROJECT_UPSTREAMING_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_UPSTREAMING_APP_PRIVATE_KEY }}
          owner: riseproject-upstreaming
          repositories: ${{ steps.result.outputs.fork_name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Rebuild, validate and push to riscv64 (exact-head lease)
        id: push
        if: steps.result.outputs.publish == 'true'
        working-directory: control
        env:
          UPSTREAMING_FORK_TOKEN: ${{ steps.fork-token.outputs.token }}
          UPSTREAMING_PUBLISH_ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          rc=0
          prev=$(jq -r '.candidate // empty' ../prev/outcome.json 2>/dev/null || true)
          uv run --locked \
            python -m fork_publish publish --record ../in/record.json --task ../in/task.json \
              --proposal ../in/proposal.json --mbox ../in/patches.mbox --result ../in/result.json \
              ${prev:+--previous-candidate "$prev"} --out ../in/outcome.json || rc=$?
          jq . ../in/outcome.json >> "$GITHUB_STEP_SUMMARY"
          # Answering the feedback follows a confirmed push of a task that
          # carried review feedback, and nothing else.
          if [ "$(jq -r .status ../in/outcome.json)" = published ] \
            && jq -e '[.context.reason_evidence[]? | select(.kind == "human_relay")] | length > 0' \
              ../in/task.json > /dev/null; then
            echo "respond=true" >> "$GITHUB_OUTPUT"
          fi
          exit $(( rc == 1 || rc == 3 ? 0 : rc ))

      - name: Post the review loop summary on the pushed commit
        if: steps.result.outputs.publish == 'true'
        continue-on-error: true
        working-directory: control
        env:
          UPSTREAMING_FORK_TOKEN: ${{ steps.fork-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$(jq -r .status ../in/outcome.json)" = published ] && [ -f ../in/report.json ]; then
            uv run --locked \
              python -m review_loop comment --task ../in/task.json --report ../in/report.json \
                --fork "$(jq -r .fork ../in/task.json)" --head "$(jq -r .candidate ../in/outcome.json)"
          fi

      - name: Mint a feedback response token for exactly this fork
        id: response-token
        if: steps.push.outputs.respond == 'true'
        # Best effort: a token that cannot be minted never fails a publication.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RISEPROJECT_UPSTREAMING_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_UPSTREAMING_APP_PRIVATE_KEY }}
          owner: riseproject-upstreaming
          repositories: ${{ steps.result.outputs.fork_name }}
          permission-pull-requests: write
      - name: Answer the addressed feedback and resolve its inline threads
        if: steps.push.outputs.respond == 'true' && steps.response-token.outcome == 'success'
        continue-on-error: true
        working-directory: control
        env:
          UPSTREAMING_FORK_TOKEN: ${{ steps.response-token.outputs.token }}
        run: |
          set -uo pipefail
          # Best effort and idempotent (each reply carries a marker of the
          # feedback item and the head): an error is a warning, never a
          # failed publication, and the actions taken are kept in the
          # publication artifact.
          rc=0
          uv run --locked python -m review_response --record ../in/record.json \
            --task ../in/task.json --proposal ../in/proposal.json \
            --outcome ../in/outcome.json --out ../in/feedback-responses.json || rc=$?
          if [ "$rc" != 0 ]; then
            echo "::warning::the feedback was not fully answered or resolved (exit ${rc}); the publication stands"
            echo "The feedback was not fully answered or resolved (exit ${rc}): see feedback-responses.json in the publication artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          [ -f ../in/feedback-responses.json ] && jq . ../in/feedback-responses.json >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

      - name: Mint a CI rerun token for exactly this fork
        id: rerun-token
        if: steps.result.outputs.rerun == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RISEPROJECT_UPSTREAMING_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_UPSTREAMING_APP_PRIVATE_KEY }}
          owner: riseproject-upstreaming
          repositories: ${{ steps.result.outputs.rerun_fork }}
          permission-actions: write

      - name: Rerun the failed jobs on the exact head and read the attempts back
        if: steps.result.outputs.rerun == 'true'
        working-directory: control
        env:
          UPSTREAMING_FORK_TOKEN: ${{ steps.rerun-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAMING_PUBLISH_ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          rc=0
          uv run --locked \
            python -m ci_rerun publish --record ../in/record.json --task ../in/task.json \
              --out ../in/outcome.json || rc=$?
          jq . ../in/outcome.json >> "$GITHUB_STEP_SUMMARY"
          exit $(( rc == 1 || rc == 3 ? 0 : rc ))

      - name: Record which worker run this retry belongs to
        if: always()
        env:
          RUN: ${{ inputs.worker-run-id }}
        run: |
          set -euo pipefail
          printf '%s' "$RUN" > in/worker-run-id

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: porting-publication
          path: |
            in/assignment.json
            in/claim.json
            in/task.json
            in/result.json
            in/preflight.json
            in/rerun.json
            in/feedback-responses.json
            in/outcome.json
            in/proposal.json
            in/patches.mbox
            in/plan.json
            in/report.json
            in/worker-run-id
          if-no-files-found: ignore
          retention-days: 30

  notify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: control
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: porting-publication
          path: publication
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: comment-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-contents: read
          permission-issues: write
      - name: Publish or discover a retried verified plan comment
        working-directory: control
        env:
          GH_TOKEN: ${{ steps.comment-token.outputs.token }}
          PORTING_COMMENT_AUTHOR: riseproject-dev[bot]
        run: |
          set -euo pipefail
          [ "$(jq -r .status ../publication/outcome.json)" = planning ] || { echo "verified planning unavailable; no comment"; exit 0; }
          uv run --locked \
            python -m plan_comment \
              --plan ../publication/plan.json --proposal ../publication/proposal.json \
              --task ../publication/task.json --result ../publication/result.json \
              --out ../notification/outcome.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: porting-notification
          path: notification/outcome.json
          if-no-files-found: ignore
          retention-days: 30

  continuation:
    needs: [publish, notify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: control-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-contents: read
          permission-actions: write
      - name: Continue reconciliation after publication retry
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: gh workflow run controller.yml --repo "$GITHUB_REPOSITORY" --ref main
