name: Build and deploy status site

on:
  push:
    branches: [main]
    paths:
      - '.state/**'
      - 'docs/**'
      - 'scripts/generate_doc.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Generate status from committed lifecycle state
        run: uv run --locked python scripts/generate_doc.py --output docs/index.md
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        id: pages-upload
        with:
          path: ./_site
      - name: Wait for exact Pages artifact readback
        id: pages-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python scripts/pages_artifact.py discover
          --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempts 6
          --github-output "$GITHUB_OUTPUT"
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Recheck Pages artifact after a failed deployment attempt
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        run: >-
          uv run --locked python scripts/pages_artifact.py verify
          --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --artifact-id "$EXPECTED_ARTIFACT_ID" --attempts 3
      - name: Retry GitHub Pages deployment once
        if: steps.deployment.outcome == 'failure'
        id: deployment-retry
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
