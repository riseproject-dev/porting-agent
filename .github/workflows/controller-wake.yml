# Runs the controller at the time a controller run reported that something
# waits for. No model or destination credential is used.
name: Controller Wake

on:
  workflow_dispatch:
    inputs:
      at:
        description: 'The time to run the controller at, in UTC (YYYY-MM-DDTHH:MM:SSZ)'
        required: true
        type: string

permissions:
  contents: read

# At most one sleeper exists: the newest report of the controller wins.
concurrency:
  group: porting-agent-controller-wake
  cancel-in-progress: true

jobs:
  wake:
    # Not `ubuntu-slim`: its jobs are stopped after 15 minutes, and this one
    # sleeps for hours.
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Sleep until the reported time
        env:
          AT: ${{ inputs.at }}
        run: |
          set -euo pipefail
          [[ "$AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::the time is not an ISO UTC time"; exit 1; }
          # At most 5 h 45 min: a later wait is carried by the controller run
          # this one starts, which reports it again.
          sleep "$(uv run --locked python -m wake sleep-seconds --at "$AT")"
      # Minted after the sleep: an App token lasts one hour.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: dispatch-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-actions: write
      - name: Run the controller
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: gh workflow run controller.yml --repo "$GITHUB_REPOSITORY" --ref main
