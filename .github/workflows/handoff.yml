# SPDX-License-Identifier: MIT
# Trusted handoff operations after an accepted `/upstreaming submit-upstream`
# and its checked submission rewrite and review: build the upstream branch
# riscv64 of the one verified fork from the reviewed series under an
# exact-head lease (never while a pull request is open from it or riscv64-dev
# is missing; riscv64-dev and the development PR are not touched), dispatch
# the project's required CI workflow on riscv64 when the clean head needs its
# own CI and the workflow can be dispatched, rerun the interrupted jobs of CI
# on the clean head (a `ci_rerun` operation the collector planned in
# handoff.waiting_ci) with a token for the one fork that carries only
# `actions: write`, and post the submission package on the tracking issue. Each job checks out the state at the head of main, checks
# that it is still the head and still runs the controller-recorded operation
# before it mints a token, validates the operation again before any effect, and
# uploads a receipt the controller reads back. No model runs here and no
# credential can write upstream.
name: Handoff
run-name: "Handoff ${{ inputs.operation-id }}"
on:
  workflow_dispatch:
    inputs:
      operation-id:
        description: Controller-recorded handoff operation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: porting-fork-writer
  cancel-in-progress: false
jobs:
  target:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.target.outputs.kind }}
      fork_name: ${{ steps.target.outputs.fork_name }}
      artifact_id: ${{ steps.target.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The state at the head of main when the job starts, not the
          # commit the run was dispatched at: a queued or re-run job reads
          # the current state.
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - name: Validate the operation and name the one fork it may write
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation-id }}
        run: uv run --locked python -m handoff target --operation-id "$OPERATION"

  upstream-branch:
    needs: [target]
    if: needs.target.outputs.kind == 'upstream_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The job's own token downloads the reviewed series from the
      # publication artifact of the worker run in this repository.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The state at the head of main when the job starts, not the
          # commit the run was dispatched at: a queued or re-run job reads
          # the current state.
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - name: Check the operation against the head of main before any token is minted
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation-id }}
        run: uv run --locked python -m handoff check --operation-id "$OPERATION" --kind upstream_branch --out handoff/outcome.json
      - name: Download the reviewed series of the accepted review
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.target.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "invalid publication artifact id"; exit 1; }
          mkdir -p review
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT" > review/artifact.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > review/artifact.zip
          unzip -q -o -j review/artifact.zip -d review/files
          [ -f review/files/patches.mbox ] && [ ! -L review/files/patches.mbox ] || { echo "no reviewed series"; exit 1; }
      - name: Check the artifact and the digest of the reviewed series and rebuild and check it anonymously before any token is minted
        id: series
        env:
          OPERATION: ${{ inputs.operation-id }}
        run: uv run --locked python -m handoff series --operation-id "$OPERATION" --series review/files/patches.mbox --artifact-meta review/artifact.json --workdir "$RUNNER_TEMP/handoff-series" --out handoff/outcome.json
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: fork-token
        with:
          client-id: ${{ vars.RISEPROJECT_UPSTREAMING_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_UPSTREAMING_APP_PRIVATE_KEY }}
          owner: riseproject-upstreaming
          repositories: ${{ needs.target.outputs.fork_name }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: ci-token
        # Only when the clean head has another tree than the candidate head
        # and needs its own CI: dispatches the project's required CI workflow
        # on riscv64.
        if: steps.series.outputs.needs_ci == 'true'
        with:
          client-id: ${{ vars.RISEPROJECT_UPSTREAMING_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_UPSTREAMING_APP_PRIVATE_KEY }}
          owner: riseproject-upstreaming
          repositories: ${{ needs.target.outputs.fork_name }}
          permission-actions: write
      - name: Verify the checked series and push riscv64 under the exact-head lease and read back
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation-id }}
          UPSTREAMING_FORK_TOKEN: ${{ steps.fork-token.outputs.token }}
          UPSTREAMING_CI_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: uv run --locked python -m handoff branch --operation-id "$OPERATION" --series review/files/patches.mbox --artifact-meta review/artifact.json --workdir "$RUNNER_TEMP/handoff-series" --out handoff/outcome.json
      - name: Record a failed attempt
        if: failure()
        env:
          OPERATION: ${{ inputs.operation-id }}
        run: uv run --locked python -m handoff failed --operation-id "$OPERATION" --out handoff/outcome.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: porting-handoff
          path: handoff/outcome.json
          if-no-files-found: ignore
          retention-days: 30

  submission-comment:
    needs: [target]
    if: needs.target.outputs.kind == 'submission_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The state at the head of main when the job starts, not the
          # commit the run was dispatched at: a queued or re-run job reads
          # the current state.
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - name: Check the operation against the head of main before any token is minted
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation-id }}
        run: uv run --locked python -m handoff check --operation-id "$OPERATION" --kind submission_comment --out handoff/outcome.json
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: issue-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-issues: write
      - name: Post or discover the submission package and read it back
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation-id }}
          UPSTREAMING_ISSUE_TOKEN: ${{ steps.issue-token.outputs.token }}
        run: uv run --locked python -m handoff comment --operation-id "$OPERATION" --out handoff/outcome.json
      - name: Record a failed attempt
        if: failure()
        env:
          OPERATION: ${{ inputs.operation-id }}
        run: uv run --locked python -m handoff failed --operation-id "$OPERATION" --out handoff/outcome.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: porting-handoff
          path: handoff/outcome.json
          if-no-files-found: ignore
          retention-days: 30

  ci-rerun:
    needs: [target]
    if: needs.target.outputs.kind == 'ci_rerun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The state at the head of main when the job starts, not the
          # commit the run was dispatched at: a queued or re-run job reads
          # the current state.
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - name: Check the operation against the head of main before any token is minted
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation-id }}
        run: uv run --locked python -m ci_rerun check --operation-id "$OPERATION" --phase handoff
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: rerun-token
        with:
          client-id: ${{ vars.RISEPROJECT_UPSTREAMING_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_UPSTREAMING_APP_PRIVATE_KEY }}
          owner: riseproject-upstreaming
          repositories: ${{ needs.target.outputs.fork_name }}
          permission-actions: write
      - name: Rerun the interrupted jobs of CI on the clean head and read the attempts back
        env:
          OPERATION: ${{ inputs.operation-id }}
          UPSTREAMING_FORK_TOKEN: ${{ steps.rerun-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m ci_rerun operation --operation-id "$OPERATION" --phase handoff --out ci-rerun/outcome.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: porting-ci-rerun
          path: ci-rerun/outcome.json
          if-no-files-found: ignore
          retention-days: 30

  continuation:
    needs: [target, upstream-branch, submission-comment, ci-rerun]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: control-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-contents: read
          permission-actions: write
      - name: Continue reconciliation after the handoff operation
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: gh workflow run controller.yml --repo "$GITHUB_REPOSITORY" --ref main
