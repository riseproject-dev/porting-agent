# SPDX-FileCopyrightText: 2026 The RISE Project
# SPDX-License-Identifier: MIT
# Trusted lifecycle reconciliation. No model or destination credential is used.
name: Controller

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'policy.json'
      - 'pyproject.toml'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/**'
  issues:
    types: [opened, labeled, unlabeled, reopened]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows:
      - Dispatcher
      - Planner
      - Worker
      - Reproduction Image
      - Fork Provisioning
      - Development PR
      - Publish Retry
      - Handoff
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  # Prompt acknowledgement is independent of serialized reconciliation.
  acknowledge-command:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: control-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-issues: write
      - name: Acknowledge a visible upstreaming command
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          first=$(printf '%s\n' "$COMMENT_BODY" | awk 'NF { print; exit }')
          [[ "$first" == /upstreaming\ * ]] || exit 0
          reactions=$(gh api "/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions?per_page=100")
          jq -e 'any(.[]; .content == "eyes" and .user.login == "riseproject-dev[bot]")' \
            <<<"$reactions" >/dev/null || \
            gh api -X POST "/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
              -f content='eyes' >/dev/null

  filter:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' || github.event_name == 'workflow_run' ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.labels.*.name, 'upstreaming-request') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'upstreaming-request'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/upstreaming '))
    steps:
      - run: echo "event accepted for reconciliation"

  observe:
    needs: filter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Controller tick (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          # The retention of the worker's publication artifact, as its
          # generated lock sets it, for the expiry of a submission rewrite.
          UPSTREAMING_ARTIFACT_RETENTION_DAYS: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '30' }}
        run: |
          set -euo pipefail
          uv run --locked python -m controller observe > report.json
          {
            echo '## Porting controller report (read-only)'
            echo '```json'
            cat report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: porting-controller-report
          path: report.json
          retention-days: 30

  reconcile:
    needs: filter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: porting-agent-controller
      cancel-in-progress: false
    environment: state
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Is the policy read-only?
        id: policy
        run: echo "read_only=$(jq -r .read_only policy.json)" >> "$GITHUB_OUTPUT"
      - name: Collect verified planner, worker, and publish-only retry outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p publications
          for workflow in planner.lock.yml worker.lock.yml publish-retry.yml; do
            filter=
            if [ "$workflow" = publish-retry.yml ]; then
              # A retry the controller launched on main, once it completed.
              filter='&status=completed&branch=main&event=workflow_dispatch'
            fi
            runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=20$filter" \
              --jq '.workflow_runs[].id') \
              || { echo "$workflow run inventory unavailable this tick" >&2; runs=; }
            printf '%s\n' "$runs" | while read -r run; do
              [ -n "$run" ] || continue
              id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                --jq '[.artifacts[] | select(.name == "porting-publication" and (.expired | not))] | if length == 1 then .[0].id elif length == 0 then empty else error("expected one publication artifact") end') \
                || { echo "publication artifact inventory unavailable or ambiguous for $run" >&2; continue; }
              [ -n "$id" ] || continue
              mkdir -p "publications/$run"
              gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "publications/$run/a.zip" \
                || { rm -rf "publications/$run"; continue; }
              unzip -q -o -j "publications/$run/a.zip" -d "publications/$run" \
                || { rm -rf "publications/$run"; continue; }
              printf '%s' "$id" > "publications/$run/artifact-id"
              task=$(jq -r '.task // empty' "publications/$run/task.json" 2>/dev/null || true)
              # A retry's Result is the Result of the worker run it publishes.
              # Only a publish-only retry names another run: a planner or
              # worker artifact is the Result of its own run, whatever it holds.
              worker_run=$run
              if [ "$workflow" = publish-retry.yml ]; then
                worker_run=$(cat "publications/$run/worker-run-id" 2>/dev/null || true)
                [[ "$worker_run" =~ ^[1-9][0-9]{0,19}$ ]] \
                  || { echo "publish-only retry $run names no worker run" >&2; rm -rf "publications/$run"; continue; }
              else
                rm -f "publications/$run/worker-run-id"
              fi
              if [ ! -f "publications/$run/outcome.json" ]; then
                if [ "$task" = planning ] && [ -f "publications/$run/result.json" ] \
                    && [ -f "publications/$run/proposal.json" ] && [ -f "publications/$run/plan.json" ]; then
                  uv run --locked python -m planning_recovery \
                    --directory "publications/$run" --run-id "$worker_run" \
                    || { echo "trusted planning recovery rejected $run" >&2; rm -rf "publications/$run"; continue; }
                else
                  echo "incomplete publication for $run" >&2
                  rm -rf "publications/$run"
                  continue
                fi
              fi
              if [ "$task" != planning ] && [ -f "publications/$run/outcome.json" ] \
                  && [ -f "publications/$run/proposal.json" ] && [ -f "publications/$run/result.json" ]; then
                uv run --locked python -m worker_recovery \
                  --directory "publications/$run" --run-id "$worker_run" \
                  || { echo "trusted worker recovery rejected $run" >&2; rm -rf "publications/$run"; continue; }
              fi
            done
          done
      - name: Collect trusted provisioning receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p provisions
          # A failure receipt has nothing to read back: only runs of the
          # workflow on main that the controller dispatched are collected.
          runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/provision.yml/runs?status=completed&branch=main&event=workflow_dispatch&per_page=20" \
            --jq '.workflow_runs[].id') || runs=
          printf '%s\n' "$runs" | while read -r run; do
            [ -n "$run" ] || continue
            id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name == "porting-provisioning" and (.expired | not))][0].id // empty') || continue
            [ -n "$id" ] || continue
            mkdir -p "provisions/$run"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "provisions/$run/a.zip" || continue
            unzip -q -o -j "provisions/$run/a.zip" -d "provisions/$run" || continue
            printf '%s' "$id" > "provisions/$run/artifact-id"
          done
      - name: Observe the development PR runs still in flight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read before the receipts: a run that completes in between is seen
          # in flight or as a receipt, never as neither. Without the list the
          # controller holds a launched development PR operation as possibly
          # in flight.
          if gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/dev-pr.yml/runs?branch=main&event=workflow_dispatch&per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed") | {id, status, title: .display_title}]' > development-pr-runs.tmp; then
            mv development-pr-runs.tmp development-pr-runs.json
          else
            rm -f development-pr-runs.tmp development-pr-runs.json
            echo "development PR run inventory unavailable this tick" >&2
          fi
      - name: Collect trusted development PR receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p development-prs
          runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/dev-pr.yml/runs?status=completed&per_page=20" \
            --jq '.workflow_runs[].id') || runs=
          printf '%s\n' "$runs" | while read -r run; do
            [ -n "$run" ] || continue
            id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name == "porting-development-pr" and (.expired | not))][0].id // empty') || continue
            [ -n "$id" ] || continue
            mkdir -p "development-prs/$run"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "development-prs/$run/a.zip" || continue
            unzip -q -o -j "development-prs/$run/a.zip" -d "development-prs/$run" || continue
            printf '%s' "$id" > "development-prs/$run/artifact-id"
          done
      - name: Collect trusted CI rerun receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-reruns
          # The development PR workflow reruns CI in development, the
          # handoff workflow CI on the clean head.
          dev=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/dev-pr.yml/runs?status=completed&per_page=20" \
            --jq '.workflow_runs[].id') || dev=
          handoff=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/handoff.yml/runs?status=completed&branch=main&event=workflow_dispatch&per_page=20" \
            --jq '.workflow_runs[].id') || handoff=
          printf '%s\n%s\n' "$dev" "$handoff" | while read -r run; do
            [ -n "$run" ] || continue
            id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name == "porting-ci-rerun" and (.expired | not))][0].id // empty') || continue
            [ -n "$id" ] || continue
            mkdir -p "ci-reruns/$run"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "ci-reruns/$run/a.zip" || continue
            unzip -q -o -j "ci-reruns/$run/a.zip" -d "ci-reruns/$run" || continue
            printf '%s' "$id" > "ci-reruns/$run/artifact-id"
          done
      - name: Observe the handoff runs still in flight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read before the receipts: a run that completes in between is seen
          # in flight or as a receipt, never as neither. Without the list the
          # controller holds a launched handoff attempt as possibly in flight.
          if gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/handoff.yml/runs?branch=main&event=workflow_dispatch&per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed") | {id, status, title: .display_title}]' > handoff-runs.tmp; then
            mv handoff-runs.tmp handoff-runs.json
          else
            rm -f handoff-runs.tmp handoff-runs.json
            echo "handoff run inventory unavailable this tick" >&2
          fi
      - name: Collect trusted handoff receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p handoffs
          runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/handoff.yml/runs?status=completed&branch=main&event=workflow_dispatch&per_page=20" \
            --jq '.workflow_runs[].id') || runs=
          printf '%s\n' "$runs" | while read -r run; do
            [ -n "$run" ] || continue
            id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name == "porting-handoff" and (.expired | not))][0].id // empty') || continue
            [ -n "$id" ] || continue
            mkdir -p "handoffs/$run"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "handoffs/$run/a.zip" || continue
            unzip -q -o -j "handoffs/$run/a.zip" -d "handoffs/$run" || continue
            printf '%s' "$id" > "handoffs/$run/artifact-id"
          done
      - name: Reconcile deterministic state locally
        env:
          GH_TOKEN: ${{ github.token }}
          # The retention of the worker's publication artifact, as its
          # generated lock sets it, for the expiry of a submission rewrite.
          UPSTREAMING_ARTIFACT_RETENTION_DAYS: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '30' }}
        run: |
          set -euo pipefail
          gh_aw=$(scripts/install_gh_aw.sh "$RUNNER_TEMP/gh-aw-cli") || gh_aw=
          uv run --locked python -m reconcile --publications publications \
            --provisions provisions --development-prs development-prs --handoffs handoffs \
            --handoff-runs handoff-runs.json --development-pr-runs development-pr-runs.json \
            --ci-reruns ci-reruns \
            --report report.json \
            ${gh_aw:+--gh-aw "$gh_aw"}
          {
            echo '## Porting reconciliation'
            echo '```json'
            cat report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mint a control-repository token for the state commit
        id: state-token
        if: steps.policy.outputs.read_only == 'false'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-contents: write
      - name: Publish one validated state-only commit on main
        if: steps.policy.outputs.read_only == 'false'
        env:
          GH_TOKEN: ${{ steps.state-token.outputs.token }}
          APP_SLUG: ${{ steps.state-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          scripts/git_identity.sh
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          uv run --locked python -m state_commit \
            --message "porting-agent: reconcile state (run ${GITHUB_RUN_ID})"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.policy.outputs.read_only == 'false'
        id: issue-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-contents: read
          permission-issues: write
      - name: Publish comments for recovered verified planning runs
        if: steps.policy.outputs.read_only == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issue-token.outputs.token }}
          PORTING_COMMENT_AUTHOR: riseproject-dev[bot]
          PORTING_PLAN_RECOVERY: '1'
        run: |
          set -euo pipefail
          mkdir -p recovered-plan-comments
          for marker in publications/*/recovered-planning; do
            [ -f "$marker" ] || continue
            directory=${marker%/recovered-planning}
            run=${directory##*/}
            uv run --locked python -m plan_comment \
              --plan "$directory/plan.json" --proposal "$directory/proposal.json" \
              --task "$directory/task.json" --result "$directory/result.json" \
              --out "recovered-plan-comments/$run.json"
          done
      # These projections run only after durable state publication. Each scans
      # committed receipts/events and is idempotent, so a later tick repairs a
      # failure between the state commit and its human-facing projection.
      - name: Mark command receipts complete
        if: steps.policy.outputs.read_only == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issue-token.outputs.token }}
        run: uv run --locked python -m command_reactions --out command-reactions/receipts.json
      - name: Append lifecycle entries to tracking issues
        if: steps.policy.outputs.read_only == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issue-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --locked python -m status_ledger --report report.json --run-url "$RUN_URL"
          --out status-ledger/receipts.json
      - name: Explain rejected commands on their tracking issues
        if: steps.policy.outputs.read_only == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issue-token.outputs.token }}
        run: uv run --locked python -m command_feedback --out command-feedback/receipts.json
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.policy.outputs.read_only == 'false'
        id: dispatch-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: porting-agent
          permission-contents: read
          permission-actions: write
      - name: Launch dispatcher for durable selected Work
        if: steps.policy.outputs.read_only == 'false'
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: |
          set -euo pipefail
          count=$(jq '(.requested_effects | length) + (.dispatch_relaunch // [] | length)' report.json)
          [ "$count" -gt 0 ] || exit 0
          gh workflow run dispatcher.lock.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Launch durable fork provisioning operations
        if: steps.policy.outputs.read_only == 'false'
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: |
          set -euo pipefail
          jq -r '.provision_requests[].operation_id' report.json | while read -r operation; do
            gh workflow run provision.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f operation-id="$operation"
          done
      - name: Launch due publication retries
        if: steps.policy.outputs.read_only == 'false'
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: |
          set -euo pipefail
          jq -r '.publication_retries[] | "\(.worker_run_id) \(.attempt)"' report.json \
            | while read -r run attempt; do
              gh workflow run publish-retry.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f worker-run-id="$run" -f attempt="$attempt"
            done
      - name: Launch durable development PR operations
        if: steps.policy.outputs.read_only == 'false'
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: |
          set -euo pipefail
          jq -r '.dev_pr_requests[].operation_id' report.json | while read -r operation; do
            gh workflow run dev-pr.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f operation-id="$operation"
          done
      - name: Launch durable handoff operations
        if: steps.policy.outputs.read_only == 'false'
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: |
          set -euo pipefail
          jq -r '.handoff_requests[].operation_id' report.json | while read -r operation; do
            gh workflow run handoff.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f operation-id="$operation"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: porting-control-receipts
          path: |
            report.json
            recovered-plan-comments/*.json
            status-ledger/receipts.json
            command-feedback/receipts.json
            command-reactions/receipts.json
          if-no-files-found: ignore
          retention-days: 30
