name: Upstream RISC-V support
description: Request planning and upstream integration of Linux RISC-V (riscv64) support for a project, in any language.
title: "[upstreaming] "
labels: ["upstreaming-request"]
body:
  - type: input
    id: upstream-repository
    attributes:
      label: Upstream repository
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Packages
      description: Optional. The packages the project publishes, one per line, as their registry names them (for example a PyPI distribution, a crate, an npm package, a Go module, or Maven group:artifact coordinates). Leave blank if the project publishes no package.
    validations:
      required: false
  - type: input
    id: target-branch
    attributes:
      label: Upstream target branch
      description: Optional. Leave blank for planning.
  - type: textarea
    id: additional-notes
    attributes:
      label: Additional notes
      description: Optional language, toolchain, build system, recipes, patches, dependencies, optimization needs, runner constraints, contribution rules, or contact.
    validations:
      required: false
