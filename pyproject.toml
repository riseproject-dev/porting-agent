[project]
name = "porting-agent-control"
version = "0.0.0"
description = "Trusted control plane for the RISE RISC-V porting agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "jsonschema>=4.26.0",
  "packaging>=26.3",
  "pyyaml>=6.0.3",
  "requests==2.34.2",
  "requests-cache==1.3.3",
]

[dependency-groups]
dev = [
  "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["scripts/gh-aw-compat/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# The migrated proven implementation intentionally retains compact fixture and
# table formatting. Milestone 2 lint focuses on imports and executable defects.
ignore = ["E401", "E501", "E702", "E731", "UP017", "UP033", "UP035"]
